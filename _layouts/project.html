---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>

  <p class="skills">
    <strong>Skills:</strong>
    {% for skill in page.skills %}<a href="{{ '/skills/' | relative_url }}#{{ skill | slugify }}">{{ skill }}</a>{% unless forloop.last %}, {% endunless %}{% endfor %}
  </p>

  {{ content }}
</article>
